version: "3"

tasks:
  sync:
    desc: Install backend dependencies for local development with uv.
    dir: backend
    cmds:
      - uv sync --group dev

  deps:check:
    desc: Verify that uv.lock is up to date with backend/pyproject.toml.
    dir: backend
    cmds:
      - uv lock --check

  lint:
    desc: Run backend lint and formatting checks.
    dir: backend
    cmds:
      - uv run --locked ruff check .
      - uv run --locked ruff format --check .

  format:
    desc: Format backend code and apply safe lint fixes.
    dir: backend
    cmds:
      - uv run --locked ruff format .
      - uv run --locked ruff check . --fix

  privacy:export-worker:once:
    desc: Run one privacy export worker drain pass.
    dir: backend
    cmds:
      - uv run --locked python -m app.commands.privacy_export_worker --once

  privacy:export-worker:dry-run:
    desc: Count queued privacy export artifacts without mutating state.
    dir: backend
    cmds:
      - >-
        uv run --locked python -m app.commands.privacy_export_worker
        --dry-run --once

  test:lightweight:
    desc: Run lightweight tests without expensive or opt-in execution markers.
    dir: backend
    cmds:
      - uv run --locked pytest -q -m "not integration and not e2e and not container and not slow and not external_db"

  test:integration:
    desc: Run integration tests except external DB tests.
    dir: backend
    cmds:
      - uv run --locked pytest -q -m "integration and not external_db" -rs

  test:e2e:
    desc: Run e2e tests except external DB tests.
    dir: backend
    cmds:
      - uv run --locked pytest -q -m "e2e and not external_db" -rs

  test:container:
    desc: Run tests that require containerised ephemeral infrastructure.
    dir: backend
    cmds:
      - uv run --locked pytest -q -m "container and not external_db" -rs

  test:slow:
    desc: Run intentionally slower tests except external DB tests.
    dir: backend
    cmds:
      - uv run --locked pytest -q -m "slow and not external_db" -rs

  test:safe:
    desc: Run the broad safe backend test suite used by the CI quality gate.
    dir: backend
    cmds:
      - uv run --locked pytest -q -m "not external_db"

  test:security:
    desc: Run security regression tests except external DB tests.
    dir: backend
    cmds:
      - uv run --locked pytest -q -m "security and not external_db"

  test:auth:
    desc: Run authentication-focused tests except external DB tests.
    dir: backend
    cmds:
      - uv run --locked pytest -q -m "auth and not external_db"

  test:authz:
    desc: Run authorization and permission-boundary tests except external DB tests.
    dir: backend
    cmds:
      - uv run --locked pytest -q -m "authz and not external_db"

  test:privacy:
    desc: Run privacy and data-minimisation tests except external DB tests.
    dir: backend
    cmds:
      - uv run --locked pytest -q -m "privacy and not external_db"

  test:contracts:
    desc: Run backend contract tests.
    dir: backend
    cmds:
      - uv run --locked pytest -q -m contract

  test:external-db:
    desc: Run opt-in external DB tests.
    dir: backend
    cmds:
      - uv run --locked pytest -q -m external_db --run-external-db -rs

  pre-push:
    desc: Run local checks before pushing without duplicating focused pytest subsets.
    cmds:
      - task: deps:check
      - task: lint
      - task: test:safe

  ci:
    desc: Run the local equivalent of the GitHub backend quality gate.
    cmds:
      - task: deps:check
      - task: lint
      - task: test:safe
