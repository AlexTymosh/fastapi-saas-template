[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-saas-template"
version = "0.1.0"
description = "FastAPI SaaS backend template (modular monolith, GDPR-aware)"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "fastapi>=0.135,<1.0",
    "uvicorn[standard]>=0.44,<1.0",
    "pydantic>=2.13,<3.0",
    "email-validator>=2.3,<3.0",
    "pydantic-settings>=2.13,<3.0",
    "scalar-fastapi>=1.8,<2.0",
    "structlog>=25.5,<26.0",
    "PyJWT[crypto]>=2.10,<3.0",
    "cryptography>=47.0,<48.0",
    "hvac>=2.4,<3.0",
    "sqlalchemy[asyncio]>=2.0,<2.2",
    "alembic>=1.18,<2.0",
    "psycopg[binary]>=3.1,<4.0",
    "redis[hiredis]>=5.0,<6.0",
    "dramatiq[redis]>=1.18,<2.0",
    "limits[async-redis]>=5.8,<6.0",
    "opentelemetry-api==1.28.2",
    "opentelemetry-sdk==1.28.2",
    "opentelemetry-exporter-otlp-proto-http==1.28.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0,<10.0",
    "testcontainers>=4.14.2,<5.0",
    "ruff>=0.15,<1.0",
    "pre-commit>=4.5,<5.0",
    "httpx>=0.28,<1.0",
    "aiosqlite>=0.21,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = [
    "unit: deprecated legacy marker for fast tests; leave lightweight/default tests unmarked",
    "integration: tests that combine application code with ephemeral external services via Testcontainers",
    "e2e: end-to-end tests that exercise full API flows against ephemeral infrastructure",
    "external_db: opt-in tests that use TEST_DATABASE_URL and must never run by default",
    "security: security regression tests and security-sensitive behaviour checks",
    "auth: authentication and JWT validation security tests",
    "authz: authorization and permission-boundary tests",
    "privacy: privacy-sensitive behaviour and data-minimisation tests",
    "container: tests that require containerised ephemeral infrastructure",
    "slow: tests that are intentionally slower than the default lightweight suite",
    "contract: contract tests for API/schema/client compatibility",
    "bola: legacy tenant isolation, BOLA and IDOR micro-marker; prefer folder-based selection for new tests",
    "audit: legacy audit trail and audit visibility micro-marker; prefer folder-based selection for new tests",
    "rate_limit: legacy rate limiting abuse-prevention micro-marker; prefer folder-based selection for new tests",
    "cors: legacy browser-facing CORS security micro-marker; prefer folder-based selection for new tests",
    "logging_security: legacy logging redaction and sensitive-data leakage micro-marker; prefer folder-based selection for new tests",
    "secrets: legacy secrets/configuration hardening micro-marker; prefer folder-based selection for new tests",
]

[tool.alembic]
script_location = "%(here)s/migrations"
prepend_sys_path = ["%(here)s"]
file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s"
timezone = "UTC"