repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: python -m ruff check --fix
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff format
        entry: python -m ruff format
        language: system
        types_or: [python, pyi]

      - id: pytest-unit
        name: pytest unit
        entry: python -m pytest -q -m "not integration and not e2e and not external_db"
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]