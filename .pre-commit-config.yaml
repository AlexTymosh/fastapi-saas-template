repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv
        args: ["run", "--project", "backend", "ruff", "check", "--fix", "."]
        language: system
        pass_filenames: false

      - id: ruff-format
        name: ruff format
        entry: uv
        args: ["run", "--project", "backend", "ruff", "format", "."]
        language: system
        pass_filenames: false

      - id: pytest-unit
        name: pytest unit
        entry: uv
        args:
          [
            "run",
            "--project",
            "backend",
            "pytest",
            "-q",
            "-m",
            "not integration and not e2e and not external_db",
          ]
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]