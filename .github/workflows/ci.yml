name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Filter changed paths
        id: filter
        # dorny/paths-filter v3.0.3.
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590
        with:
          predicate-quantifier: every
          filters: |
            backend:
              - ".github/workflows/**"
              - ".python-version"
              - ".pre-commit-config.yaml"
              - "Taskfile.yml"
              - "backend/**"
              - "!backend/docs/**"
              - "!backend/**/*.md"

  backend-quality-gate:
    name: Backend quality gate
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.7.22"
          enable-cache: true

      - name: Check lockfile
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Check formatting
        run: uv run --frozen ruff format --check .

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Run non-external-db tests
        run: uv run --frozen pytest -q -m "not external_db"

  ci-status:
    name: CI status
    needs:
      - changes
      - backend-quality-gate
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Evaluate required checks
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "The changes detection job did not succeed."
            exit 1
          fi

          case "${{ needs.backend-quality-gate.result }}" in
            success|skipped)
              echo "Backend quality gate result is acceptable: ${{ needs.backend-quality-gate.result }}."
              ;;
            failure|cancelled)
              echo "Backend quality gate did not pass: ${{ needs.backend-quality-gate.result }}."
              exit 1
              ;;
            *)
              echo "Unexpected backend quality gate result: ${{ needs.backend-quality-gate.result }}."
              exit 1
              ;;
          esac
